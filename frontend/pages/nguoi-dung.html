<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quản lý người dùng — Admin</title>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <strong>QL Giảng viên thỉnh giảng</strong>
    <nav>
      <a href="tra-cuu-giang-vien.html" data-role="DonVi">Tra cứu / Lập danh sách</a>
      <a href="danh-sach-don-vi.html" data-role="DonVi">Danh sách đơn vị</a>
      <a href="thanh-ly.html" data-role="DonVi">Thanh lý</a>
      <a href="hop-dong.html" data-role="Admin">Hợp đồng</a>
      <a href="danh-muc.html" data-role="Admin">Danh mục</a>
      <a href="nguoi-dung.html" data-role="Admin">Người dùng</a>
      <span id="hoTenHienTai" style="margin-right:12px; font-size:13px; opacity:0.85;"></span>
      <a href="#" onclick="clearSession(); window.location.href='../index.html';">Đăng xuất</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h2>Danh sách tài khoản</h2>
      <table>
        <thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Vai trò</th><th>Đơn vị</th><th>Trạng thái</th><th></th></tr></thead>
        <tbody id="bangNguoiDung"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Tạo tài khoản mới</h2>
      <label>Tên đăng nhập *</label><input id="ndTenDangNhap" />
      <label>Mật khẩu ban đầu *</label><input id="ndMatKhau" type="text" placeholder="Người dùng nên đổi ngay sau lần đăng nhập đầu tiên" />
      <label>Họ tên</label><input id="ndHoTen" />
      <label>Vai trò *</label>
      <select id="ndVaiTro" onchange="capNhatHienThiDonVi()">
        <option value="DonVi">Người phụ trách đơn vị (DonVi)</option>
        <option value="Admin">Quản trị hệ thống (Admin)</option>
      </select>
      <div id="khungChonDonVi">
        <label>Đơn vị phụ trách *</label>
        <select id="ndDonVi"></select>
      </div>
      <button onclick="taoTaiKhoan()">Tạo tài khoản</button>
      <div id="loi" class="error"></div>
      <div id="thanhCong" style="color:#1a7a35; margin-top:8px;"></div>
    </div>
  </main>

  <script src="../assets/js/api.js"></script>
  <script>
    requireRole('Admin');
    initNav();

    let danhSachDonVi = [];

    function capNhatHienThiDonVi() {
      const vaiTro = document.getElementById('ndVaiTro').value;
      document.getElementById('khungChonDonVi').style.display = vaiTro === 'DonVi' ? 'block' : 'none';
    }

    async function khoiTao() {
      danhSachDonVi = await callApi('danhSachDonVi', {});
      document.getElementById('ndDonVi').innerHTML = danhSachDonVi.map(d => `<option value="${d.ID_DonVi}">${d.Ten_DonVi}</option>`).join('');
      capNhatHienThiDonVi();
      taiDanhSachNguoiDung();
    }

    async function taiDanhSachNguoiDung() {
      const list = await callApi('danhSachNguoiDung', {});
      const donViMap = {};
      danhSachDonVi.forEach(d => { donViMap[d.ID_DonVi] = d.Ten_DonVi; });
      document.getElementById('bangNguoiDung').innerHTML = list.map(u => `
        <tr>
          <td>${u.Ten_Dang_Nhap}</td>
          <td>${u.Ho_Ten || ''}</td>
          <td>${u.Vai_Tro}</td>
          <td>${donViMap[u.ID_DonVi] || ''}</td>
          <td>${u.Trang_Thai}</td>
          <td>
            <button class="secondary" onclick="doiTrangThai('${u.ID_NguoiDung}', '${u.Trang_Thai === 'Hoat_Dong' ? 'Khoa' : 'Hoat_Dong'}')">
              ${u.Trang_Thai === 'Hoat_Dong' ? 'Khoá' : 'Mở khoá'}
            </button>
          </td>
        </tr>`).join('');
    }

    async function taoTaiKhoan() {
      const loiEl = document.getElementById('loi');
      loiEl.textContent = '';
      document.getElementById('thanhCong').textContent = '';
      const vaiTro = document.getElementById('ndVaiTro').value;
      try {
        await callApi('taoNguoiDung', {
          nguoiDung: {
            Ten_Dang_Nhap: document.getElementById('ndTenDangNhap').value.trim(),
            MatKhau: document.getElementById('ndMatKhau').value,
            Ho_Ten: document.getElementById('ndHoTen').value,
            Vai_Tro: vaiTro,
            ID_DonVi: vaiTro === 'DonVi' ? document.getElementById('ndDonVi').value : '',
          },
        });
        document.getElementById('thanhCong').textContent = 'Đã tạo tài khoản.';
        document.getElementById('ndTenDangNhap').value = '';
        document.getElementById('ndMatKhau').value = '';
        document.getElementById('ndHoTen').value = '';
        taiDanhSachNguoiDung();
      } catch (err) {
        loiEl.textContent = err.message;
      }
    }

    async function doiTrangThai(idNguoiDung, trangThaiMoi) {
      try {
        await callApi('suaNguoiDung', { idNguoiDung, patch: { Trang_Thai: trangThaiMoi } });
        taiDanhSachNguoiDung();
      } catch (err) {
        document.getElementById('loi').textContent = err.message;
      }
    }

    khoiTao();
  </script>
</body>
</html>
